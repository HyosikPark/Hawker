# Hawker gateway — Fly.io 배포 설정
# 배포: fly launch --no-deploy (앱 이름 확정) → fly volumes create hawker_data → fly deploy
app = "hawker-gateway"
primary_region = "nrt"

[build]
  dockerfile = "apps/gateway/Dockerfile"

[env]
  PORT = "8402"
  HAWKER_DB_PATH = "/data/hawker.db"
  # x402: CDP facilitator (테스트넷 base-sepolia 유지 → Bazaar 발견용, 실돈 0)
  # CDP_API_KEY_ID / CDP_API_KEY_SECRET 는 fly secrets 로 주입
  HAWKER_X402_MODE = "cdp"
  HAWKER_X402_NETWORK = "base-sepolia"
  HAWKER_PAYTO_ADDRESS = "0x98563C4b9d6F1D18bfe6Bd813DD2C6c3CFcE7B19"

[mounts]
  source = "hawker_data"
  destination = "/data"

[http_service]
  internal_port = 8402
  force_https = true
  auto_stop_machines = "off"   # SQLite 단일 인스턴스 — 항상 켜둠
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
